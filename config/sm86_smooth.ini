; ============================================================================
;  sm86_smooth - configuration
;
;  Place this file next to version.dll (the game directory), together with
;  shaders\vfi.hlsl.
; ============================================================================

[frame_gen]
; master switch
enabled=1

; Position of the synthesised frame.
;   0.0        = extrapolation past the current frame (adds no latency, shows
;                occlusion holes on newly revealed content)
;   0.5        = midpoint (default; adds about half an output frame of latency)
extrapolate=0

; ---------------------------------------------------------------------------
; Optical-flow search radii, in pixels OF THE LEVEL, not of the frame.
; The pyramid is 1/1 -> 1/2 -> 1/4 -> 1/8 (luma) with 4x4 blocks, so the final
; flow grid is 1/4 of the frame and the coarse search grid is 1/8.
;
;   radius_l3 = 0  -> auto: width * 0.008, clamped to [2,32].
;                     Reach in full-res pixels = radius_l3 * 8.
;                     A fixed pixel radius is wrong: at 1440p a value that is
;                     comfortable at 1080p clips fast motion at the window
;                     edge, and a clipped search does not merely miss - it
;                     returns a confidently wrong vector (the SAD surface is
;                     monotonic along the clipped axis and flat across it).
;   radius_l2 / l1 / l0 are local re-searches around the previous level's
;   estimate. They are capped at 4 by the groupshared tile size (RMAX).
; ---------------------------------------------------------------------------
radius_l3=0
radius_l2=4
radius_l1=4
radius_l0=2

; forward/backward consistency threshold, full-res pixels
fb_thresh=1.5

; high-frequency transfer gain (1.0 = keep the source detail unchanged)
hf_amount=1.0

; fallback blend weight where neither direction is trusted
;   0.0 = always prefer the older frame, 1.0 = the newer, 0.5 = average
; 0.5 is the honest default and also the source of "double image" on a hard
; edged moving object. See README, "known limitations".
w_bias=0.5

; temporal average in static regions (free noise reduction)
temporal_aa=1

[present]
; extra buffers added on top of what the game asked for. Each game frame
; consumes two presentations (synthesised, then real), so the swapchain needs
; at least 3. 2 gives headroom.
buffer_bump=2

; frames of command-list pipelining
max_in_flight=3

[log]
; JSONL log -> <dll dir>\logs\native_<pid>.jsonl
log=1
